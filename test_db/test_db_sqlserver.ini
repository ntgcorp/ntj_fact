[CONFIG]
TYPE=NTJOBS.APP.1
NAME=NTJ_FACT_TEST_DB_SQLSRVER
LOG=test_db_sqlsrver
EXIT=TRUE

[JOB_CREATE_DB]
COMMAND=DB.CREATE
DB.ID=TEST
TYPE=SQLSERVER
DBNAME=$ENV.NTJ_FACT_SQLSERVER_DBNAME
USER=$ENV.NTJ_FACT_SQLSERVER_USER
PASSWORD=$ENV.NTJ_FACT_SQLSERVER_PWD

[JOB_OPEN]
COMMAND=DB.OPEN
DB.ID=TEST
TYPE=SQLSERVER
DBNAME=$ENV.NTJ_FACT_SQLSERVER_DBNAME
USER=$ENV.NTJ_FACT_SQLSERVER_USER
PASSWORD=$ENV.NTJ_FACT_SQLSERVER_PWD

[JOB_CREATE_TAB]
COMMAND=TAB.CREATE.JSON
DB.ID=TEST
FILE.IN.STRUCT=test_cf.json

[JOB_IMPORT]
COMMAND=DB.IMPORT
DB.ID=TEST
FILE.IN.STRUCT=test_cf.json
FILE.IN.CSV=test_cf_dati.csv
MODE=REPLACE

[JOB_DELETE_ONE]
COMMAND=SQL.EXEC
DB.ID=TEST
SQL=DELETE FROM [test_cf] WHERE [CF]='MRNDVD82A05C351S'

[JOB_EXPORT]
COMMAND=DB.EXPORT
DB.ID=TEST
OUT.QUERY=SELECT [CF], [NOMINATIVO] FROM [test_cf] ORDER BY [CF]
FILE.OUT.QUERY=test_db_sqlsrver.csv

[JOB_CLOSE]
COMMAND=DB.CLOSE
DB.ID=TEST
