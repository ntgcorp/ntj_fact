[CONFIG]
TYPE=NTJOBS.APP.1
NAME=NTJ_FACT_TEST_DB_SQLITE
LOG=test_db_sqlite
EXIT=TRUE

[JOB_CREATE_DB]
COMMAND=DB.CREATE
DB.ID=TEST
TYPE=SQLITE
FILE.IN.DB=test_db.sqlite

[JOB_OPEN]
COMMAND=DB.OPEN
DB.ID=TEST
TYPE=SQLITE
FILE.IN.DB=test_db.sqlite

[JOB_CREATE_TAB]
COMMAND=TAB.CREATE.JSON
DB.ID=TEST
FILE.IN.STRUCT=test_cf.json

[JOB_IMPORT]
COMMAND=DB.IMPORT
DB.ID=TEST
FILE.IN.STRUCT=test_cf.json
FILE.IN.CSV=test_cf_dati.csv
MODE=REPLACE

[JOB_DELETE_ONE]
COMMAND=SQL.EXEC
DB.ID=TEST
SQL=DELETE FROM test_cf WHERE CF='MRNDVD82A05C351S'

[JOB_EXPORT]
COMMAND=DB.EXPORT
DB.ID=TEST
OUT.QUERY=SELECT CF, NOMINATIVO FROM test_cf ORDER BY CF
FILE.OUT.QUERY=test_db_sqlite.csv

[JOB_CLOSE]
COMMAND=DB.CLOSE
DB.ID=TEST

[JOB_COMPACT]
COMMAND=DB.COMPACT
FILE.IN.DB=test_db.sqlite
